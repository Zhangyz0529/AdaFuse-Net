[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "adafuse-repro"
version = "0.1.0"
description = "AdaFuse-Net reproducible research implementation"
requires-python = ">=3.9"
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
where = ["src"]
[project.scripts]
adafuse = "adafuse.cli.main:main"
